name: Validate

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Site
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Tests
        run: npm test

      - name: Lint Prose
        run: npm run lint:prose

      - name: Build Site
        run: npm run build
